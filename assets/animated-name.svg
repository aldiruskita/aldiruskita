<svg width="850" height="90" viewBox="0 0 850 90" xmlns="http://www.w3.org/2000/svg">

  <defs>

```
<linearGradient id="rgbGradient" x1="0%" y1="0%" x2="100%" y2="0%">

  <stop offset="0%" stop-color="#ff004c">
    <animate
      attributeName="stop-color"
      values="#ff004c;#ff7a00;#ffe600;#00ff88;#00d9ff;#7a5cff;#ff00c8;#ff004c"
      dur="7s"
      repeatCount="indefinite"
    />
  </stop>

  <stop offset="50%" stop-color="#00d9ff">
    <animate
      attributeName="stop-color"
      values="#00d9ff;#7a5cff;#ff00c8;#ff004c;#ff7a00;#00ff88;#00d9ff"
      dur="7s"
      repeatCount="indefinite"
    />
  </stop>

  <stop offset="100%" stop-color="#7a5cff">
    <animate
      attributeName="stop-color"
      values="#7a5cff;#ff00c8;#ff004c;#ff7a00;#ffe600;#00ff88;#7a5cff"
      dur="7s"
      repeatCount="indefinite"
    />
  </stop>

</linearGradient>

<filter id="glow">
  <feGaussianBlur
    stdDeviation="3"
    result="blur"
  />

  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>

</filter>
